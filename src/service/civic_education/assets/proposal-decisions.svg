<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 1230" role="img"
aria-labelledby="proposal-title proposal-description" class="civic-circle-drawing">
<title id="proposal-title">Quem propõe e vota em cada esfera</title>
<desc id="proposal-description">Prefeito e vereadores; governador e deputados estaduais;
governador do DF e deputados distritais; presidente, deputados federais e senadores.
O Legislativo propõe e vota. O Executivo pode propor e sancionar ou vetar projetos de lei.
Vices exercem essas competências quando assumem o cargo do titular.</desc>

<g text-anchor="middle"><text x="290" y="30" class="civic-svg-label">Município</text>
<circle cx="135" cy="150" r="100" class="civic-role-circle"/>
<text x="135" y="115" class="proposal-role-label">Prefeito</text>
<text x="135" y="175" class="proposal-action-label">Pode propor</text>
<text x="135" y="198" class="proposal-action-label">Sanciona ou veta</text>
<circle cx="445" cy="150" r="100" class="civic-role-circle"/>
<text x="445" y="115" class="proposal-role-label">Vereadores</text>
<text x="445" y="175" class="proposal-action-label">Podem propor</text>
<text x="445" y="198" class="proposal-action-label">Votam o projeto</text>
<text x="290" y="156" class="civic-svg-label">⇄</text>
<text x="445" y="267" class="proposal-house-label">Câmara · Municipal</text></g>
