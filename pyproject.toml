[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "se-liga-brasil"
version = "0.1.0"
description = "Ingestão auditável de dados oficiais de candidaturas brasileiras"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2", "duckdb>=1.4,<2"]

[tool.vercel]
entrypoint = "app:app"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "coverage[toml]>=7.10,<8"]
analytical = ["duckdb>=1.4,<2"]

[project.scripts]
se-liga-brasil = "application.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a PostgreSQL connection; all test writes are rolled back"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.setuptools.package-data]
"service.project_information" = ["*.html"]
"service.public_profile_web" = ["assets/*.css", "assets/*.svg", "assets/*LICENSE.txt", "assets/people-viewport.js"]
"service.civic_education" = ["assets/*.css", "assets/*.svg"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.html]
directory = "reports/coverage-html"
